name: Sync CLAP

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest CLAP tag
        id: latest
        run: |
          latest_tag=$(curl -sSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/free-audio/clap/tags?per_page=100" \
            | jq -r '.[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -rV \
            | head -n1)

          if [ -z "$latest_tag" ]; then
            echo "Could not resolve a latest CLAP tag" >&2
            exit 1
          fi

          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Compare against tracked version
        id: compare
        run: |
          tracked="none"
          if [ -f TRACKED_VERSION ]; then
            tracked=$(cat TRACKED_VERSION | tr -d '[:space:]')
          fi

          latest="${{ steps.latest.outputs.tag }}"
          echo "tracked=$tracked latest=$latest"

          if [ "$tracked" = "$latest" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout CLAP headers at latest tag
        if: steps.compare.outputs.up_to_date == 'false'
        uses: actions/checkout@v7
        with:
          repository: free-audio/clap
          ref: ${{ steps.latest.outputs.tag }}
          sparse-checkout: |
            include/clap
          sparse-checkout-cone-mode: false
          path: clap

      - name: Setup Odin
        if: steps.compare.outputs.up_to_date == 'false'
        uses: laytan/setup-odin@v2
        with:
          release: latest

      - name: Install libclang
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          sudo apt install libclang-dev

      # odin-c-bindgen needs to link against libclang.so, so we just have to create
      # a symlink to one of the versioned files (from odin-c-bindgen/workflows/build.yml)
      - name: Symlink libclang.so
        if: steps.compare.outputs.up_to_date == 'false'
        run: sudo ln -s libclang-18.so.1 /lib/x86_64-linux-gnu/libclang.so
        working-directory: /lib/x86_64-linux-gnu/

      - name: Build odin-c-bindgen
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          mkdir bin

          git clone --depth 1 https://github.com/karl-zylinski/odin-c-bindgen.git odin-c-bindgen
          cd odin-c-bindgen
          odin build src -out:bindgen.bin
          mv bindgen.bin ../bin/bindgen.bin

      - name: Copy binding footers into clap
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          cp -rv bindings/footers/. clap/include/clap

      - name: Generate bindings
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          mkdir -p bindings/clap

          ./bin/bindgen.bin ./bindings/clap.bindgen.sjson
          ./bin/bindgen.bin ./bindings/ext.bindgen.sjson
          ./bin/bindgen.bin ./bindings/draft.bindgen.sjson

      - name: Update TRACKED_VERSION
        if: steps.compare.outputs.up_to_date == 'false'
        run: echo "${{ steps.latest.outputs.tag }}" > TRACKED_VERSION

      - name: Stash generated output
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          mkdir -p /tmp/clap-output

          # root-level generated .odin files
          find . -maxdepth 1 -name '*.odin' -exec cp {} /tmp/clap-output/ \;

          # generated subdirectories (ext/, draft/, etc.) - anything not part of
          # the source repo scaffolding or CLAP/bindgen checkouts
          for dir in */; do
            dir="${dir%/}"
            case "$dir" in
              clap|odin-c-bindgen|bindings|test|bin|.github)
                continue
                ;;
            esac
            if [ -d "$dir" ]; then
              cp -r "$dir" /tmp/clap-output/"$dir"
            fi
          done

          cp README.md /tmp/clap-output/README.md

      - name: Create empty base branch
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tag="${{ steps.latest.outputs.tag }}"

          if ! git ls-remote --exit-code --heads origin "$tag" >/dev/null 2>&1; then
            git checkout --orphan "$tag"
            git reset --hard
            rm -rf ./* ./.[!.]* 2>/dev/null || true
            git commit --allow-empty -m "init $tag"
            git push origin "$tag"
          fi

      - name: Create candidate branch with generated output
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          tag="${{ steps.latest.outputs.tag }}"

          git checkout --orphan "${tag}-candidate"
          git reset --hard
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          cp -r /tmp/clap-output/. .

          git add -A
          git commit -m "Update bindings to CLAP ${tag}"
          git push --force origin "${tag}-candidate"

      - name: Open pull request
        if: steps.compare.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.latest.outputs.tag }}"

          if gh pr view "${tag}-candidate" --json state -q .state >/dev/null 2>&1; then
            echo "PR already exists for ${tag}-candidate, skipping creation"
          else
            gh pr create \
              --base "$tag" \
              --head "${tag}-candidate" \
              --title "Update CLAP bindings ${tag}" \
              --label clap-update \
              --body "$(cat <<EOF
          Generated by Sync CLAP workflow.

          Derived from: https://github.com/free-audio/clap/releases/tag/${tag}

          Review before merging.
          EOF
          )"
          fi
