name: Sync CLAP

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest CLAP tag
        id: latest
        run: |
          latest_tag=$(curl -sSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/free-audio/clap/tags?per_page=100" \
            | jq -r '.[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -rV \
            | head -n1)

          if [ -z "$latest_tag" ]; then
            echo "Could not resolve a latest CLAP tag" >&2
            exit 1
          fi

          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Compare against tracked version
        id: compare
        run: |
          tracked="none"
          if [ -f TRACKED_VERSION ]; then
            tracked=$(cat TRACKED_VERSION | tr -d '[:space:]')
          fi

          latest="${{ steps.latest.outputs.tag }}"
          echo "tracked=$tracked latest=$latest"

          if [ "$tracked" = "$latest" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT" 
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout CLAP headers at latest tag
        if: steps.compare.outputs.up_to_date == 'false'
        uses: actions/checkout@v7
        with:
          repository: free-audio/clap
          ref: ${{ steps.latest.outputs.tag }}
          sparse-checkout: |
            include/clap
          sparse-checkout-cone-mode: false
          path: clap

      - name: Setup Odin
        if: steps.compare.outputs.up_to_date == 'false'
        uses: laytan/setup-odin@v2
        with:
          release: latest

#       - name: Build odin-c-bindgen
#         if: steps.compare.outputs.up_to_date == 'false'
#         run: |
#           git clone --depth 1 https://github.com/karl-zylinski/odin-c-bindgen.git odin-c-bindgen
#           cd odin-c-bindgen
#           odin build . -out:../bin -o:speed

      - name: Generate bindings
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          mkdir -p bindings/clap
          ./bin/bindgen.bin ./bindings
      
      - name: Update TRACKED_VERSION
        if: steps.compare.outputs.up_to_date == 'false'
        run: echo "${{ steps.latest.outputs.tag }}" > TRACKED_VERSION

      - name: Open pull request
        if: steps.compare.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.latest.outputs.tag }}
          commit-message: "Update bindings to CLAP ${{ steps.latest.outputs.tag }}"
          title: "Update CLAP bindings ${{ steps.latest.outputs.tag }}"
          labels: clap-update
          body: |
            Generated by Sync CLAP workflow.

            Derived from: https://github.com/free-audio/clap/releases/tag/${{ steps.latest.outputs.tag }}

            Review before merging.
          
