name: Validate

on:
  pull_request:
    paths:
      - "bindings/**"
      - "test/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pull_requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Odin
        if: steps.compare.outputs.up_to_date == 'false'
        uses: laytan/setup-odin@v2
        with:
          release: latest

      - name: Build test plugin
        run: |
          mkdir -p Build
          odin build test -build-mode:shared -out:build/test.so -o:speed

          cp build/test.so build/test.clap

      - name: Build clap-validator
        run: |
          git clone --depth 1 https://github.com/free-audio/clap-validator.git
          cd clap-validator
          cargo build --release
          cp target/release/clap-validator ../bin/clap-validator

      - name: Run clap-validator
        run: |
          ./bin/clap-validator validate ./build/test.clap --json \
          > validation-report.json || echo "validator_failed=true" >> "$GITHUB_OUTPUT"

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## clap-validator results"
            echo ""
            echo '```json'
            cat validation-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync("validation-report.json", "utf-8");
            const status = '${{ steps.validate.outputs.validator_failed }}' === 'true'
            ? "Validation failed"
            : "Validation passed";


            const body = [
              `### ${status}`,
              '',
              '<details><summary>clap-validator report</summary>',
              '',
              '```json',
              report,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes("clap-validator report"));
            if (existing != null) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if validation failed
        if: steps.validate.outputs.validator_failed == 'true'
        run: exit 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@4
        with:
          name: clap-validator
          path: validation-report.json


