name: Validate

on:
  pull_request:
    types: [labeled]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    if: ${{ github.event.label.name == 'clap-update' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          release: latest

        # write test/main.odin to the directory, since all non-binding files are removed
        # when the candidate pull request is created. not ideal, but im tired
      - name: Write plugin test
        run: |
          mkdir test
          cat > test/main.odin <<EOL
          package test

          import "base:runtime"
          import clap ".."
          import "core:c"

            PluginState :: struct {
              plugin: clap.clap_plugin,
          }

          PLUGIN_ID               :: "com.cykreet.test"
          PLUGIN_NAME             :: "Bindgen Test"
          PLUGIN_VENDOR   :: "cykreet"
          PLUGIN_VERSION  :: "0.0.1"

          descriptor := clap.clap_plugin_descriptor {
              clap_version    = clap.CLAP_VERSION,
              id                              = PLUGIN_ID,
              name                    = PLUGIN_NAME,
              vendor                  = PLUGIN_VENDOR,
              url                             = "",
              manual_url              = "",
              support_url             = "",
              version                 = PLUGIN_VERSION,
              description             = "plugin used to validate generated bindings",
              features                = raw_data([]cstring {
                clap.CLAP_PLUGIN_FEATURE_AUDIO_EFFECT,
                clap.CLAP_PLUGIN_FEATURE_STEREO,
                nil
            }),
          }

          plugin_init :: proc "c" (p: ^clap.clap_plugin) -> c.bool {
            return true
          }

          plugin_destroy :: proc "c" (p: ^clap.clap_plugin) {
            context = runtime.default_context()
            state := (^PluginState)(p.plugin_data)
            free(state)
          }

          plugin_activate :: proc "c" (p: ^clap.clap_plugin, sample_rate: c.double, min_frames: u32, max_frames: u32) -> c.bool {
            return true
          }

          plugin_deactivate :: proc "c" (p: ^clap.clap_plugin) {}

          plugin_start_processing :: proc "c" (p: ^clap.clap_plugin) -> c.bool {
            return true
          }

          plugin_stop_processing :: proc "c" (p: ^clap.clap_plugin) {}

          plugin_reset :: proc "c" (p: ^clap.clap_plugin) {}

          plugin_process :: proc "c" (p: ^clap.clap_plugin, process: ^clap.clap_process) -> clap.clap_process_status {
            outputs := cast([^]clap.clap_audio_buffer_t) process.audio_outputs
            for i in 0 ..< process.audio_outputs_count {
              out := outputs[i]
              if out.data32 != nil {
                channels := cast([^]^f32) out.data32

                for ch in 0 ..< out.channel_count {
                  samples := cast([^]f32) channels[ch]
                  for f in 0 ..< process.frames_count do samples[f] = 0
                }
              }
            }

            return clap.CLAP_PROCESS_CONTINUE
          }

          plugin_get_extension :: proc "c" (p: ^clap.clap_plugin, id: cstring) -> rawptr {
            return nil
          }

          plugin_on_main_thread :: proc "c" (p: ^clap.clap_plugin) {}

          factory_get_plugin_count :: proc "c" (factory: ^clap.clap_plugin_factory) -> u32 {
            return 1
          }

          factory_get_plugin_descriptor :: proc "c" (factory: ^clap.clap_plugin_factory, index: u32) -> ^clap.clap_plugin_descriptor {
            return index == 0 ? &descriptor : nil
          }

          factory_create_plugin :: proc "c" (factory: ^clap.clap_plugin_factory, host: ^clap.clap_host, plugin_id: cstring) -> ^clap.clap_plugin {
            if plugin_id != PLUGIN_ID {
              return nil
            }

            context = runtime.default_context()
            state := new(PluginState)
            state.plugin = clap.clap_plugin {
              desc                            = &descriptor,
              plugin_data                     = state,
              init                            = plugin_init,
              destroy                         = plugin_destroy,
              activate                        = plugin_activate,
              deactivate                      = plugin_deactivate,
              start_processing        = plugin_start_processing,
              stop_processing         = plugin_stop_processing,
              reset                           = plugin_reset,
              process                         = plugin_process,
              get_extension           = plugin_get_extension,
              on_main_thread          = plugin_on_main_thread,
            }

            return &state.plugin
          }

          plugin_factory := clap.clap_plugin_factory {
            get_plugin_count                = factory_get_plugin_count,
            get_plugin_descriptor   = factory_get_plugin_descriptor,
            create_plugin                   = factory_create_plugin,
          }

          entry_init :: proc "c" (plugin_path: cstring) -> c.bool {
            return true
          }

          entry_deinit :: proc "c" () {}

          entry_get_factory :: proc "c" (factory_id: cstring) -> rawptr {
            if factory_id == clap.CLAP_PLUGIN_FACTORY_ID {
              return &plugin_factory
            }

            return nil
          }

          @(export)
          clap_entry := clap.clap_plugin_entry {
            clap_version    = clap.CLAP_VERSION,
            init                    = entry_init,
            deinit                  = entry_deinit,
            get_factory             = entry_get_factory,
          }
          EOL

      - name: Build test plugin
        run: |
          mkdir -p build
          odin build test -build-mode:shared -out:build/test.clap -o:speed

      - name: Build clap-validator
        run: |
          mkdir bin

          git clone --depth 1 https://github.com/free-audio/clap-validator.git
          cd clap-validator
          cargo build --release
          cp target/release/clap-validator ../bin/clap-validator

      - name: Run clap-validator
        run: |
          ./bin/clap-validator validate ./build/test.clap --json \
          > validation-report.json || echo "validator_failed=true" >> "$GITHUB_OUTPUT"

      - name: Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            let body;
            if ('${{ steps.validate.outputs.validator_failed }}' === 'true' && !fs.existsSync("validation-report.json")) {
              body = "## clap-validator report\n\nThe validator crashed before it could produce a report.";
            } else {
              const report = fs.readFileSync("validation-report.json", "utf-8");
              const reportData = JSON.parse(report);

              const getTestInfo = (result) => {
                const lib = result.test["plugin-library"];
                const inst = result.test["plugin-instance"];
                const entry = lib ?? inst;
                return {
                  name: entry.test,
              path: entry.path,
              pluginId: inst ? inst.plugin_id : null,
              code: result.status.code,
              details: result.status.details,
                };
              };

              const tests = reportData.results.map(getTestInfo);

              const passedTests = tests.filter(t => t.code === "success");
              const skippedTests = tests.filter(t => t.code === "skipped");
              const failedTests = tests.filter(t => t.code !== "success" && t.code !== "skipped");

              const total = tests.length;

              const formatTest = (t) => {
                const label = t.pluginId ? `${t.name} (${t.pluginId})` : t.name;
              const detail = t.details ? `\n  - ${t.details}` : "";
              return `- \`${t.path}\` — ${label}${detail}`;
              };

              const sections = [];

              if (failedTests.length > 0) {
                sections.push(`### Failed (${failedTests.length})\n\n${failedTests.map(formatTest).join("\n")}`);
              }

              if (skippedTests.length > 0) {
                sections.push(
                `<details>\n<summary>Skipped (${skippedTests.length})</summary>\n\n${skippedTests.map(formatTest).join("\n")}\n\n</details>`
                );
              }

              if (passedTests.length > 0) {
                sections.push(
                `<details>\n<summary>Passed (${passedTests.length})</summary>\n\n${passedTests.map(formatTest).join("\n")}\n\n</details>`
                );
              }

              const status = failedTests.length > 0 ? "Failing" : "Passing";
              const summary = `${passedTests.length} passed, ${failedTests.length} failed, ${skippedTests.length} skipped (${total} total)`;

              body = `## clap-validator report: ${status}\n\n${summary}\n\n${sections.join("\n\n")}`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes("clap-validator report"));
            if (existing != null) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if validation failed
        if: steps.validate.outputs.validator_failed == 'true'
        run: exit 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clap-validator
          path: validation-report.json
