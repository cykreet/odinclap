name: Tag release

on:
  push:
    # branches: [main]
    paths:
      - TRACKED_VERSION

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(cat TRACKED_VERSION | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"

#       - name: Clean bindings 
#         run: |
#           rm -rf ./.github ./test ./bin ./clap ./ols.json

      - name: Check tag doesn't already exist
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
    
      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "Bindings for CLAP ${{ steps.version.outputs.version }}"

          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            Odin bindings generated against CLAP ${{ steps.version.outputs.version }}.

            https://github.com/free-audio/clap/releases/tag/${{ steps.version.outputs.version }}

      - name: Delete candidate branch
        run: |
          version="${{ steps.version.outputs.version }}"
          branch="${version}-candidate"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          else
            echo "Branch $branch does not exist, nothing to delete"
          fi
